<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ART JACKPOT — One Word, Infinite Ideas</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap');:root{--wine:#4b1726;--gold:#d6b477;--cream:#fff5df}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#7d3a4e,#401422 60%,#250b15);font-family:'DM Sans',sans-serif;color:var(--cream)}main{max-width:730px;margin:auto;padding:45px 20px;text-align:center}.eyebrow{letter-spacing:.35em;color:#e8c58b;font-size:12px}h1{font:800 clamp(48px,10vw,86px) 'Playfair Display',serif;margin:10px 0}p{color:#e5c4b8}.machine{margin-top:35px;border:8px double var(--gold);border-radius:32px;padding:30px 24px;background:linear-gradient(145deg,#78334a,#451424);box-shadow:0 25px 70px #18050b}.marquee{color:#f3d99f;letter-spacing:.24em;font-size:12px}.window{margin:25px auto;background:linear-gradient(#e3d0a7,#fff9e9 25%,#fff9e9 75%,#d9bd86);border:6px solid #b68d51;border-radius:20px;min-height:210px;display:flex;justify-content:center;align-items:center;padding:20px;box-shadow:inset 0 0 0 2px #fff3d2,0 8px 0 #290b17}.word{font:700 clamp(38px,9vw,76px) 'Playfair Display',serif;color:var(--wine);overflow-wrap:anywhere}.spinning .word{filter:blur(2px)}button{cursor:pointer;font:700 14px 'DM Sans',sans-serif}button:focus-visible{outline:3px solid white;outline-offset:4px}.spin{border:2px solid #fff0bc;border-radius:40px;background:linear-gradient(#ffe8aa,#d7a85c);padding:17px 55px;color:#4b1726;letter-spacing:.16em;box-shadow:0 5px 0 #8a5c2e}.spin:disabled{opacity:.65}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}.secondary{border:1px solid #b48b5a;border-radius:30px;padding:11px 18px;background:transparent;color:#f8dfae}.card{margin-top:28px;border:1px solid #ba8f68;background:#3b1424a8;border-radius:20px;padding:20px}.card h2{font:700 24px 'Playfair Display',serif;margin:0 0 8px}.card p{font-size:13px}.favorites{list-style:none;padding:0;margin:10px 0}.favorites li{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid #a36b6b66}.favorites button{background:none;border:0;color:#f4d6a4;font-size:20px}small{display:block;margin-top:24px;color:#d1a99e;line-height:1.7}a{color:#f2d49c}@media(max-width:500px){main{padding:26px 13px}.machine{padding:24px 12px}.window{min-height:170px}} .photo-frame{margin:18px auto 0;max-width:480px;display:none}.photo-frame.show{display:block}.photo-frame img{width:100%;max-height:420px;object-fit:contain;border:5px solid #d6b477;border-radius:14px;background:#fff8e7}.photo-frame figcaption{font-size:12px;line-height:1.6;color:#f1d5bd;margin-top:9px}.photo-frame a{overflow-wrap:anywhere}.mode-note{font-size:13px;margin:12px 0 0}.photo-controls{margin-top:20px}.photo-controls .spin{width:min(100%,320px);padding:17px 24px} </style></head><body><main><div class="eyebrow">✦ THE LITTLE CREATIVE CASINO ✦</div><h1>ART JACKPOT</h1><p>One word. Infinite possibilities.</p><section class="machine" aria-label="One-word art prompt slot machine"><div class="marquee">✦ YOUR NEXT INSPIRATION ✦</div><div class="window" id="window"><div class="word" id="word" aria-live="polite">?</div></div><button class="spin" id="spin">✦ SPIN ✦</button><div class="controls"><button class="secondary" id="save">♡ Save word</button><button class="secondary" id="copy">▢ Copy word</button></div><p id="status" role="status" aria-live="polite"></p><div class="photo-controls"><button class="spin" id="photo">✦ SPIN PHOTO ✦</button></div><figure class="photo-frame" id="photoFrame"><img id="photoImage" alt="Random photographic drawing reference"><figcaption id="photoCredit"></figcaption></figure><p id="photoStatus" role="status" aria-live="polite"></p></section><section class="card"><h2>♡ Your collection</h2><ul class="favorites" id="favorites"></ul></section><small>Photos: Wikimedia Commons · Credit and license shown with each image.</small></main><script>const words=['Frog','Moth','Pearl','Swan','Teacup','Velvet','Fox','Mirror','Mushroom','Locket','Candle','Dandelion','Snail','Butterfly','Crow','Lantern','Porcelain','Ribbon','Thorn','Shadow','Heirloom','Echo','Ballerina','Dragonfly','Acorn','Lemon','Raven','Feather','Shell','Turtle','Poppy','Fern','Rabbit','Doll','Beetle','Sparrow','Lily','Clover','Key','Clock','Peach','Fawn','Witch','Cat','Daisy','Crown','Ghost','Umbrella','Violin','Moon','Strawberry','Rose','Marble','Lace','Bumblebee','Hedgehog','Goldfish','Owl','Pigeon','Giraffe','Otter','Seal','Koi','Pomegranate','Orchid','Dew','Dusk','Whisper','Bloom','Nostalgia','Daydream','Solitude','Wonder','Wander','Memory','Melody','Silence','Glow','Fable','Harvest','Frost','Tangle','Drift','Blush','Tide','Glitter','Dust','Honey','Amber','Ink','Paper','Mask','Button','Glove','Boots','Hat','Book','Chair','Cup','Bottle','Bell','Scissors','Brush','Envelope','Window','Spoon','Apple','Fig','Cherry','Plum','Dove','Lamb','Mouse','Wolf','Horse','Deer','Goose','Tiger','Panda','Jellyfish','Crab','Starfish','Seahorse','Tulip','Dahlia','Iris','Violet','Ivy','Willow','Oak','Pinecone','Moss','Coral','Pebble','Crystal','Gem','Coin','Compass','Hourglass','Telescope','Lighthouse','Castle','Cottage','Door','Staircase','Chandelier','Curtain','Portrait','Dancer','Sailor','Knight','Queen','Clown','Gardener','Artist','Astronaut','Pirate','Fairy','Mermaid','Robot','Puppet','Grinning','Pensive','Yawning','Laughing','Frowning','Shy','Surprised','Sleepy','Curious','Worried','Proud','Bashful','Thoughtful','Startled','Smiling','Crying','Confused','Determined','Giggling','Dreamy','Skeptical','Mischievous','Serious','Embarrassed','Excited','Calm','Furious','Hopeful','Melancholy','Doubt','Joy','Fear','Awe','Disgust','Longing','Portrait','Musician','Reader','Child','Elder','Traveler','Singer','Actor','Acrobat'];const $=id=>document.getElementById(id);let current='',busy=false;const storeKey='art-jackpot-one-word-favorites';function getSaved(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')}catch{return []}}function putSaved(a){try{localStorage.setItem(storeKey,JSON.stringify(a))}catch{$('status').textContent='Saving is unavailable in this browser.'}renderSaved()}function renderSaved(){const ul=$('favorites');ul.replaceChildren();const a=getSaved();if(!a.length){const li=document.createElement('li');li.textContent='No saved words yet.';ul.append(li)}a.forEach((w,i)=>{const li=document.createElement('li');li.textContent=w;const b=document.createElement('button');b.textContent='×';b.title='Remove '+w;b.setAttribute('aria-label','Remove '+w);b.onclick=()=>{const next=getSaved();next.splice(i,1);putSaved(next)};li.append(b);ul.append(li)})}function randomWord(){let next=words[Math.floor(Math.random()*words.length)];if(words.length>1)while(next===current)next=words[Math.floor(Math.random()*words.length)];return next}async function spin(){if(busy)return;busy=true;$('spin').disabled=true;$('window').classList.add('spinning');$('status').textContent='Spinning…';const timer=setInterval(()=>{$('word').textContent=words[Math.floor(Math.random()*words.length)]},65);await new Promise(r=>setTimeout(r,1050));clearInterval(timer);current=randomWord();$('word').textContent=current;$('window').classList.remove('spinning');$('status').textContent='';$('spin').disabled=false;busy=false}$('spin').onclick=spin;$('save').onclick=()=>{if(!current){$('status').textContent='Spin for a word first.';return}const a=getSaved();if(!a.includes(current)){a.unshift(current);putSaved(a);$('status').textContent='♡ Saved!'}else $('status').textContent='Already saved.'};$('copy').onclick=async()=>{if(!current){$('status').textContent='Spin for a word first.';return}try{await navigator.clipboard.writeText(current);$('status').textContent='Copied!'}catch{$('status').textContent='Select the word to copy it manually.'}};renderSaved();
const photoSearches=['portrait photograph smiling person','portrait photograph surprised expression','portrait photograph laughing person','portrait photograph thoughtful person','animal wildlife photograph fox','animal wildlife photograph frog','animal wildlife photograph owl','animal wildlife photograph cat','animal wildlife photograph rabbit','portrait photograph elderly person'];
let lastPhoto='',photoBusy=false;
function plain(html){const el=document.createElement('div');el.innerHTML=html||'';return el.textContent||''}
async function randomPhoto(){
 if(photoBusy)return;photoBusy=true;$('photo').disabled=true;$('photoStatus').textContent='Finding a photographic reference…';
 try{
  const topic=photoSearches[Math.floor(Math.random()*photoSearches.length)];
  const api=new URL('https://commons.wikimedia.org/w/api.php');
  api.searchParams.set('action','query');api.searchParams.set('generator','search');api.searchParams.set('gsrsearch',topic+' filetype:bitmap');api.searchParams.set('gsrnamespace','6');api.searchParams.set('gsrlimit','40');api.searchParams.set('prop','imageinfo');api.searchParams.set('iiprop','url|extmetadata|mime');api.searchParams.set('iiurlwidth','850');api.searchParams.set('format','json');api.searchParams.set('origin','*');
  const res=await fetch(api.toString());if(!res.ok)throw Error('Source unavailable');
  const data=await res.json();const pages=Object.values(data.query?.pages||{});
  const candidates=pages.filter(page=>{
   const info=page.imageinfo?.[0];if(!info?.thumburl||!info?.descriptionurl||!info.mime?.startsWith('image/'))return false;
   const meta=info.extmetadata||{};
   const desc=[page.title,plain(meta.ImageDescription?.value),plain(meta.Categories?.value),plain(meta.Credit?.value)].join(' ').toLowerCase();
   const license=meta.LicenseShortName?.value||'';
   return !/ai.generated|ai generated|artificial intelligence|stable diffusion|midjourney|dall.e|synthetic image|computer.generated|digital artwork|illustration|painting|drawing|rendered|cgi|deepfake/i.test(desc) && !/unknown/i.test(license) && page.title!==lastPhoto;
  });
  if(!candidates.length)throw Error('No suitable photographs found');
  const page=candidates[Math.floor(Math.random()*candidates.length)];const info=page.imageinfo[0];lastPhoto=page.title;
  $('photoImage').src=info.thumburl;$('photoImage').alt=page.title.replace(/^File:/,'').replace(/\.[^.]+$/,'').replaceAll('_',' ');
  const meta=info.extmetadata||{};const credit=plain(meta.Artist?.value)||'Contributor not listed';const license=plain(meta.LicenseShortName?.value)||'See source for license';
  const cap=$('photoCredit');cap.replaceChildren();cap.append(document.createTextNode('Photo: '+credit.slice(0,130)+' · '+license+' · '));
  const link=document.createElement('a');link.href=info.descriptionurl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='View original & attribution';cap.append(link);
  $('photoFrame').classList.add('show');$('photoStatus').textContent='';
 }catch(e){$('photoStatus').textContent='Could not load a photo right now. Check your internet connection and try again.'}
 finally{photoBusy=false;$('photo').disabled=false}
}
$('photo').onclick=randomPhoto;
</script></body></html>
